spring:
  application:
    name: ai-assistant-backend

  # H2 文件模式：数据落在 backend/data/ 下，重启不丢。改回内存库只需把 url 换成
  # jdbc:h2:mem:aiassistant 并加上 DB_CLOSE_DELAY=-1。
  datasource:
    url: jdbc:h2:file:./data/aiassistant
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # 表结构由 Flyway 的脚本定义，实体只做校验：映射与 SQL 不一致时启动即失败，
      # 而不是等到某次查询才炸。改结构要新增迁移脚本，不允许由实体反推。
      ddl-auto: validate
    # 出参一律走 dto，事务边界在 Service：没有「视图期还能懒加载」这个例外
    open-in-view: false

  flyway:
    # V1__init_schema.sql 等在 classpath:db/migration（默认位置），启动时按版本执行
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      # 浏览器打开 http://localhost:8080/h2-console
      # JDBC URL 填 jdbc:h2:file:./data/aiassistant，用户名 sa，密码留空
      enabled: true

server:
  port: 8080

app:
  auth:
    # 开发默认值。生产必须用环境变量 APP_AUTH_JWT_SECRET 覆盖，且至少 32 字节：
    # 仓库里的默认值对所有人可见，用它可以自签出任何账号的令牌，只能用于本机开发。
    jwt-secret: ${APP_AUTH_JWT_SECRET:dev-only-jwt-secret-do-not-use-in-production-2026}
    # 时长用 ISO-8601 写法（PT2H=2 小时，P30D=30 天）
    access-token-ttl: PT2H
    refresh-token-ttl: P30D
    # 置为 false 后 /api/v1/auth/register 返回 403，已注册账号不受影响
    registration-enabled: true

  ai:
    # OpenAI 兼容服务（PRD A.4 第 2 条：密钥只走环境变量，与 APP_AUTH_JWT_SECRET 同模式）。
    # 三项任一为空都视为未配置：AI 接口返回 AI_UNAVAILABLE，不会带空参数发起请求。
    base-url: ${AI_BASE_URL:https://llm.talkweb.com.cn/v1}
    api-key: ${AI_API_KEY:sk-bvUP5xMGz4a4R4yuNltrEln8Wrjdv51AZE1jpUH7AUfsEPNz}
    model: ${AI_MODEL:deepseek-flash}
    # 单次 AI 调用的读取超时；建议类指标 P95 ≤ 15s，超时给到 30s 留余量
    timeout: PT30S
    # 每用户每分钟建议请求上限（防连击与成本失控，A.4 第 6 条的默认值）
    rate-limit-per-minute: 10

  news:
    # 资讯采集（AI与高校课程考核资讯 PRD）：数值均为 A.4 的建议值，评审拍板后直接改这里
    # 每日 06:30 采集，与 03:30 的耗时对账错峰
    collect-cron: "0 30 6 * * *"
    source-timeout: PT60S
    page-timeout: PT10S
    max-items-per-source: 50
    max-sources-per-user: 20
    failure-threshold: 3
    ai-content-limit: 5000
    content-max-length: 20000
    manual-collect-interval: PT5M

logging:
  pattern:
    # %X{requestId} 由 RequestIdFilter 放进 MDC；定时任务线程上没有这个键，会输出空的一对方括号
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        # 只放行这三个。管理端点里不少是「能改运行状态」的（如 shutdown、env），
        # 不应该因为「顺手」而开放
        include: health,info,metrics
