# 测试专用配置：只被 test classpath 加载，遮蔽 main 的 application.yml。
# 为什么单独一份：默认配置指向 backend/data 下的 H2 文件库，dev 服务开着时
# @SpringBootTest 会因为文件锁直接起不来（Database may be already in use）。
# 测试一律跑内存库，与开发数据彻底隔离，谁开着服务都不影响谁。
spring:
  application:
    name: ai-assistant-backend-test

  datasource:
    # DB_CLOSE_DELAY=-1：连接池断开后库不销毁，同一个 JVM 里所有测试共享一次 Flyway
    url: jdbc:h2:mem:tests;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # 与 main 一致：表结构由 Flyway 定义，实体做映射校验
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: false

app:
  auth:
    # 测试值：长度满足 ≥32 字节的约束即可，不用于签发任何真实令牌
    jwt-secret: test-only-jwt-secret-0123456789abcdef0123456789abcdef
    access-token-ttl: PT2H
    refresh-token-ttl: P30D
    registration-enabled: true

  ai:
    # 测试里没有真实 AI 服务：留空即「未配置」状态，AiClient 的实现不会被真实调用
    base-url: ""
    api-key: ""
    model: ""
    timeout: PT30S
    rate-limit-per-minute: 10
